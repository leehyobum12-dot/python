[project]
name = "bareun-pipeline"
version = "1.0.0"
description = "바른인증식당 데이터 파이프라인 — 공공데이터 수집/정제/적재 자동화"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "주니어개발자", email = "leehyobum12@gmail.com" }
]
requires-python = ">=3.11,<3.13"
keywords = [
    "data-pipeline",
    "public-data",
    "restaurant",
    "supabase",
    "postgis",
    "ner",
    "korean-nlp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    # HTTP 클라이언트
    "requests>=2.31.0",
    "httpx>=0.27.0",
    
    # 데이터 처리
    "pandas>=2.2.0",
    
    # 스키마 검증
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    
    # Supabase
    "supabase>=2.5.0",
    
    # NLP / NER
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "seqeval>=1.2.2",
    "datasets>=2.19.0",
    
    # 문자열 매칭 최적화
    "pyahocorasick>=2.0.0",
    
    # 로깅
    "structlog>=24.1.0",
    
    # CLI
    "click>=8.1.0",
    
    # 워크플로우 오케스트레이션
    "prefect>=3.0.0",
    
    # 대용량 JSON 스트리밍
    "ijson>=3.2.0",
    
    # 환경변수
    "python-dotenv>=1.0.0",
    
    # 좌표계 변환 (EPSG -> WGS84, general_restaurant에서 사용)
    "pyproj>=3.6.0",
    
    # NER 및 NLP (초기 스택 명시)
    "spacy>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyright>=1.1.0",
]

[project.scripts]
bareun-pipeline = "bareun_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bareun_pipeline"]

# py.typed 파일 포함 (PEP 561)
[tool.hatch.build.targets.wheel.force-include]
"src/bareun_pipeline/py.typed" = "bareun_pipeline/py.typed"

# ═══════════════════════════════════════════════════════════
# Ruff (린터 + 포매터)
# ═══════════════════════════════════════════════════════════
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "flows", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (보안)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
    "PL", "PERF",
]
ignore = [
    "S101",    # assert 사용 허용 (테스트)
    "S311",    # random 허용 (비보안)
    "S303",    # hashlib 허용 (dedup 해시)
    "PLR0913", # 인자 개수 제한 완화 (어댑터 패턴 특성)
    "PLR0912", # 분기 개수 제한 완화 (매핑 로직)
    "PERF401", # 리스트 내포 vs append (가독성 우선)
]

# 줄 길이는 포매터에 위임하되, 100자 초과만 경고
[tool.ruff.lint.pycodestyle]
max-line-length = 100

# 특정 파일별 완화 (레거시 NLP 모듈)
[tool.ruff.lint.per-file-ignores]
"src/bareun_pipeline/preprocessing/*" = ["E501", "C901"]
"src/bareun_pipeline/training/*" = ["E501"]
"src/bareun_pipeline/nlp/*" = ["E501"]
"tests/**" = ["S101", "S106", "PLR2004"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ═══════════════════════════════════════════════════════════
# Pytest
# ═══════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=src/bareun_pipeline",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: 단위 테스트",
    "integration: 통합 테스트 (외부 API 호출 가능)",
    "slow: 오래 걸리는 테스트",
]

# ═══════════════════════════════════════════════════════════
# MyPy
# ═══════════════════════════════════════════════════════════
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torch.*",
    "seqeval.*",
    "datasets.*",
    "ijson.*",
    "prefect.*",
]
ignore_missing_imports = true

# ═══════════════════════════════════════════════════════════
# Coverage
# ═══════════════════════════════════════════════════════════
[tool.coverage.run]
source = ["src/bareun_pipeline"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]