# ============================================================
# Supabase 마이그레이션 자동 배포 워크플로우
# ============================================================
# 트리거:
# - main 브랜치 push (sql/migrations/ 변경 시)
#
# 주의:
# - SUPABASE_ACCESS_TOKEN은 GitHub Secrets에 저장 필요
# ============================================================

name: Deploy SQL Migrations

on:
  push:
    branches: [main]
    paths:
      - "sql/migrations/**"

jobs:
  deploy-migrations:
    name: Deploy SQL to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Login to Supabase
        run: supabase login --token ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push

      - name: Notify success
        if: success()
        run: echo "✅ SQL 마이그레이션 배포 완료"

      - name: Notify failure
        if: failure()
        run: echo "❌ SQL 마이그레이션 배포 실패"